services:
 mlflow:
  image: ghcr.io/mlflow/mlflow:v3.16.1
  container_name: mlflow
  command: >
   mlflow server
   --host 0.0.0.0
   --port 5000
   --backend-store-uri sqlite:////mlflow/mlflow.db
   --artifacts-destination /mlflow/artifacts
  ports:
   - '5000:5000'
  volumes:
   - mlflow-data:/mlflow

 api:
  build: .
  container_name: api
  ports:
   - '8000:8000'
  environment:
   - MLFLOW_TRACKING_URI=http://mlflow:5000
  depends_on:
   - mlflow
volumes:
 mlflow-data:
