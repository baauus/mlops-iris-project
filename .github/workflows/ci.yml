name: ML CI

on:
 push:
  branches:
   - main
 pull_request:
  branches:
   - main

jobs:
 Test:
  runs-on: ubuntu-latest

  steps:
   - uses: actions/checkout@v7.0.1
   - name: Set up Python

     uses: actions/setup-python@v7
     with:
      python-version: '3.12'

   - name: Install dependencies
     run: |
      pip install -r requirements.txt

   - name: Train model
     run: |
      python src/train.py

   - name: Run tests
     run: |
      python -m pytest

   - name: Docker build
     run: |
      docker build -t iris-api .
